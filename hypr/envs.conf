# Extra env variables are set in custom-overrides.conf
# (this file kept for reference but all env overrides moved to
#  custom-overrides.conf which is sourced by hyprland.conf)
#
# The default envs from Omarchy already set:
#   XCURSOR_SIZE, HYPRCURSOR_SIZE, GDK_BACKEND, QT_QPA_PLATFORM,
#   SDL_VIDEODRIVER=wayland,x11, MOZ_ENABLE_WAYLAND, ELECTRON_OZONE_PLATFORM_HINT,
#   XDG_SESSION_TYPE, XDG_CURRENT_DESKTOP, XDG_SESSION_DESKTOP
#
# If you need to override anything, add it to custom-overrides.conf
# using: env = KEY,VALUE

# Tensaku screenshot editor (set by `tensaku --wire-omarchy`).
env = OMARCHY_SCREENSHOT_EDITOR,/usr/bin/tensaku-edit
